# 전체 실행 — 원장 DB · 관계 생성 서비스 · 카탈로그 · 메타데이터 수집 · 화면(포털·관리)
#
#   docker compose up -d --build
#
# 경로 설정: .env 에 AMM_DIR(active-metadata-management 레포), db/.env 에 SEED_DIR(시드 데이터 레포)
# 접속: 화면 http://localhost:3000 · 관계 생성 :8000 · 카탈로그 :8084 · 수집 :8085 · 원장 DB :5433
include:
  - db/docker-compose.yml
  - path:
      - ${AMM_DIR:?.env 에 AMM_DIR(active-metadata-management 레포 경로)을 지정하세요}/docker-compose.yaml
      - docker/amm.override.yaml

services:
  relation-api:
    build: .
    image: data-relation-generate:dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://wisenut:wisenut@postgres:5432/datagokr
      CATALOG_SERVICE_URL: http://catalog-service:8084
      HF_HOME: /hf
    extra_hosts:
      # 사내 Langfuse — 호스트 /etc/hosts 항목은 컨테이너에서 보이지 않는다
      - web.langfuse.dev.cluster.wisenut:211.39.140.216
    ports:
      - 8000:8000
    volumes:
      - ${HOME}/.cache/huggingface:/hf  # 임베딩 모델 캐시 (없으면 최초 실행 시 내려받는다)
      - ./raw_uploads:/home/wisenut/app/raw_uploads
    depends_on:
      - postgres
      - catalog-service
